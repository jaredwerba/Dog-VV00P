name: DogPace
options:
  bundleIdPrefix: com.jaredwerba
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DogPaceCore:
    path: .
  WhoopBLE:
    path: ../src/Asherlc__whoop-ble-swift
targets:
  DogPace:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DogPaceCore
        product: DogPaceCore
      - package: WhoopBLE
        product: WhoopBLE
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Dog Pace reads motion from your WHOOP strap to estimate movement and distance.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredwerba.dogpace
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DUW4CY9S3L
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
